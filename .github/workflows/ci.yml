name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  agent-lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint with ruff
        run: ruff check src/ tests/

      - name: Run tests
        run: pytest tests/ -v --tb=short
        env:
          APP_ENV: test
          FPT_API_KEY: test-key

      # Chặn đúng loại sự cố đã xảy ra: đổi cấu hình chunker làm hỏng nhãn qrel
      # mà không ai biết cho tới khi metric tụt. Kiểm tra này không gọi API nên
      # chạy được trên máy CI sạch (phần cần data/chunks sẽ tự bỏ qua).
      - name: Check eval dataset integrity
        run: python eval/scripts/check_dataset_integrity.py

  backend-lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Lint with ruff
        working-directory: backend
        run: ruff check app/ tests/

      - name: Run tests
        working-directory: backend
        run: pytest tests/ -v --tb=short
        env:
          APP_ENV: test

  # Secret-scan toàn bộ lịch sử git (TASK-014): dừng CI nếu có credential thật
  # bị commit. Giá trị fallback yếu trong code (VD jwt default) không phải secret.
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan for leaked secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
