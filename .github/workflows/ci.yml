name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  agent-lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint with ruff
        run: ruff check src/ tests/

      - name: Run tests
        run: pytest tests/ -v --tb=short
        env:
          APP_ENV: test
          FPT_API_KEY: test-key

      # Chặn đúng loại sự cố đã xảy ra: đổi cấu hình chunker làm hỏng nhãn qrel
      # mà không ai biết cho tới khi metric tụt. Kiểm tra này không gọi API nên
      # chạy được trên máy CI sạch (phần cần data/chunks sẽ tự bỏ qua).
      - name: Check eval dataset integrity
        run: python eval/scripts/check_dataset_integrity.py

      # Quét lỗ hổng dependency (B4): bước đầu chỉ báo cáo để không chặn ngay
      # khi libs cũ còn nợ; sau khi dọn xong, bỏ continue-on-error để chặn.
      - name: Audit Python dependencies (agent)
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt
        continue-on-error: true

  backend-lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Lint with ruff
        working-directory: backend
        run: ruff check app/ tests/

      - name: Run tests
        working-directory: backend
        run: pytest tests/ -v --tb=short
        env:
          APP_ENV: test

      - name: Audit Python dependencies (backend)
        run: |
          pip install pip-audit
          pip-audit -r backend/requirements.txt
        continue-on-error: true

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Lint
        working-directory: frontend
        run: pnpm lint

      - name: Typecheck
        working-directory: frontend
        run: pnpm typecheck

      - name: Build
        working-directory: frontend
        run: pnpm build

      - name: Audit npm dependencies
        working-directory: frontend
        run: pnpm audit --audit-level high
        continue-on-error: true

  # Secret-scan toàn bộ lịch sử git (TASK-014): dừng CI nếu có credential thật
  # bị commit. Giá trị fallback yếu trong code (VD jwt default) không phải secret.
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan for leaked secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
