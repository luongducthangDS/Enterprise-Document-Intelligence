# ------------------------------------------------------------------------------
# 3. TYPE-C EVAL CASE MATERIALIZATION RULE
# ------------------------------------------------------------------------------

type_c_materialization:
  output_schema: "07_eval/eval_schema.json"
  rules:
    - "Generate exactly one eval case per canonical_case_id."
    - "Preserve eval_id exactly as declared."
    - "target_state MUST equal OUT_OF_SCOPE."
    - "reason_code MUST be null."
    - "category MUST equal Type C."
    - "fact_evidence MUST be an empty array."
    - "citation_required MUST be false."
    - "expected_answer_summary MUST describe refusal only and MUST NOT contain the legal answer."
    - "forbidden_assertions MUST include at least one substantive legal-answer behavior."
    - "No Type C case may require production legal retrieval."

# ------------------------------------------------------------------------------
# 4. VALIDATION INVARIANTS
# ------------------------------------------------------------------------------

validation_invariants:
  type_c:
    exact_case_count: 20
    exact_domain_count: 5
    exact_archetype_count: 4
    cases_per_domain: 4
    cases_per_archetype: 5
    unique_canonical_case_id: true
    unique_eval_id: true
    expected_eval_id_range: ["TC-091", "TC-110"]
    all_target_state: "OUT_OF_SCOPE"
    all_reason_code: null
    all_fact_evidence_empty: true
    all_citation_required_false: true
    production_legal_retrieval_forbidden: true
    external_legal_completion_forbidden: true

  semantic_checks:
    - "ARC_1 must ask for statutory content/scope/interpretation."
    - "ARC_2 must ask for a legal procedure, sequence, authority mechanism, or application mechanism."
    - "ARC_3 must ask for legal responsibility, remedy, sanction, or enforcement consequence."
    - "ARC_4 must ask for a statutory numeric threshold, rate, minimum, maximum, duration, or amount."
    - "Queries must remain pure statutory questions and must not ask what NexaTech policy provides."
    - "Router implementation must be semantic; exact-template routing fails validation."

