# ------------------------------------------------------------------------------
# 1. AGENT RUNTIME CONTRACT
# ------------------------------------------------------------------------------

agent_runtime_contract:
  output_states:
    ANSWER:
      description: "NexaTech-specific internal-policy question with sufficient internal evidence."
    ABSTAIN:
      description: "NexaTech-specific request cannot be answered from supported capabilities/evidence."
      reasons:
        - "missing_policy_evidence"
        - "requires_live_personal_data"
    OUT_OF_SCOPE:
      description: "Pure statutory/legal interpretation, citation, government procedure, state sanction, or statutory threshold request."

  routing_precedence:
    - priority: 1
      condition: "primary_intent == live_personal_transactional_data"
      state: "ABSTAIN"
      reason_code: "requires_live_personal_data"
      retrieval_allowed: false

    - priority: 2
      condition: "primary_intent == pure_statutory_or_government_legal_information"
      state: "OUT_OF_SCOPE"
      reason_code: null
      retrieval_allowed: false
      external_legal_completion_allowed: false

    - priority: 3
      condition: "primary_intent == nexatech_internal_policy"
      action: "RUN_INTERNAL_RETRIEVAL"
      retrieval_filter:
        source_role: "internal_policy"
        publication_status: "active"
        artifact_state: "frozen"
        retrieval_enabled: true
        effective_date_lte_query_date: true
        expiry_date_rule: "null_or_gte_query_date"

  statutory_intent_features:
    positive_signals:
      - "asks what a national law/decree/circular says"
      - "asks to quote or explain a statutory article"
      - "asks about filing/administrative procedure with a state authority"
      - "asks about state sanctions, administrative penalties, or statutory liability"
      - "asks for statutory minimums, mandatory thresholds, rates, or entitlements"
      - "asks about territorial statutory classification or government-prescribed wage floors"
    nexatech_internal_override:
      rule: >
        If the user asks what NexaTech policy provides, requires, permits, or pays,
        treat the query as NexaTech-internal even if the internal policy itself
        references law. Do not use external legal knowledge to complete missing facts.
      insufficient_internal_evidence_state: "ABSTAIN"
      insufficient_internal_evidence_reason: "missing_policy_evidence"

  type_c_runtime_behavior:
    expected_state: "OUT_OF_SCOPE"
    retrieval_allowed: false
    legal_corpus_retrieval_allowed: false
    external_web_completion_allowed: false
    answer_statutory_substance: false
    citation_required: false
    response_requirements:
      - "State that NexaBot only answers NexaTech internal policies."
      - "Do not provide the requested statutory answer."
      - "Do not quote statutory text."
      - "Do not provide statutory numeric values, sanctions, filing steps, or legal conclusions."
    response_template: >
      [OUT_OF_SCOPE] NexaBot chỉ hỗ trợ giải đáp các quy định và chính sách nội bộ
      do NexaTech ban hành. Câu hỏi này yêu cầu giải thích hoặc cung cấp thông tin
      pháp luật quốc gia/thủ tục cơ quan nhà nước, nên nằm ngoài phạm vi của trợ lý nội bộ.
      Vui lòng tham khảo nguồn pháp luật chính thức hoặc liên hệ Legal/HR khi cần hỗ trợ.

# ------------------------------------------------------------------------------
# 2. EVALUATION GENERATION CONTRACT
# ------------------------------------------------------------------------------

evaluation_contract:
  total_eval_cases: 140
  distribution:
    Type_A: 54
    Type_B: 34
    Type_D1: 10
    Type_D2: 5
    Type_E: 10
    Type_F: 7
    Type_C: 20

  type_c:
