        against these 20 templates. Runtime routing must classify user intent semantically.

    archetypes:
      ARC_1:
        name: "STATUTORY_CONTENT"
        description: "Nội dung, phạm vi, trích dẫn hoặc giải thích văn bản quy phạm pháp luật."
      ARC_2:
        name: "LEGAL_PROCEDURE_OR_APPLICATION_MECHANISM"
        description: "Trình tự, thủ tục hoặc cơ chế áp dụng pháp luật."
      ARC_3:
        name: "LEGAL_RESPONSIBILITY_OR_SANCTION"
        description: "Trách nhiệm pháp lý, biện pháp xử lý, chế tài hoặc xử phạt Nhà nước."
      ARC_4:
        name: "STATUTORY_NUMERIC_THRESHOLD"
        description: "Định mức, mức tối thiểu, ngưỡng, tỷ lệ hoặc giá trị số luật định."

